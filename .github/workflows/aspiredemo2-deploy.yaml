name: Deploy .NET Aspire Application to Azure

on:
  workflow_call:
    inputs:
      environment-name:
        description: "The name of the environment to deploy to (e.g., Dev, Test, Prod)"
        required: true
        type: string
      dotnet-version:
        description: "The version of .NET to use"
        required: false
        type: string
        default: "8.0.x"
      working-directory:
        description: "The working directory for the deployment"
        required: false
        type: string
        default: "./AspireDemo2/AspireDemo2.AppHost"
      azure-location:
        description: "Azure region for deployment (defaults to environment variable)"
        required: false
        type: string
        default: ""
      resource-group:
        description: "Resource group name for deployment (defaults to environment variable)"
        required: false
        type: string
        default: ""
      environment-suffix:
        description: "Optional suffix to append to the environment name for region-specific deployments"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment-name }}${{ inputs.environment-suffix != '' && format(' ({0})', inputs.environment-suffix) || '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}

    env:
      AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ENV_NAME: ${{ inputs.environment-suffix != '' && format('{0}-{1}', vars.AZURE_ENV_NAME, inputs.environment-suffix) || vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ inputs.azure-location != '' && inputs.azure-location || vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ inputs.resource-group != '' && inputs.resource-group || vars.AZURE_RESOURCE_GROUP }}
      AZD_ALPHA_ENABLE_RESOURCEGROUPDEPLOYMENTS: ${{ vars.RESOURCEGROUPDEPLOYMENTS }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Add caching for faster builds
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Install .NET Aspire workload
        run: dotnet workload install aspire

      - name: Log in with Azure (Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          azd auth login --client-id ${{ env.AZURE_CLIENT_ID }} --federated-credential-provider "github" --tenant-id ${{ env.AZURE_TENANT_ID }}
        shell: pwsh

      - name: Print Environment Variables
        run: env

      # Ensure environment name is set for azd with region-specific suffix
      - name: Set up environment name for azd
        run: |
          # Use the environment name with optional region suffix
          echo "Setting up azd environment with name: ${{ env.AZURE_ENV_NAME }}"
          azd env new ${{ env.AZURE_ENV_NAME }} --no-prompt
          
          # Set the location explicitly based on the input parameter or environment variable
          echo "Setting Azure location to: ${{ env.AZURE_LOCATION }}"
          azd env set AZURE_LOCATION ${{ env.AZURE_LOCATION }}
          
          # Set the resource group name explicitly
          echo "Setting resource group to: ${{ env.AZURE_RESOURCE_GROUP }}"
          azd env set AZURE_RESOURCE_GROUP ${{ env.AZURE_RESOURCE_GROUP }}

      # Validate infrastructure changes before deployment (Azure best practice)
      - name: Validate Infrastructure Changes
        run: azd provision --preview --no-prompt
        continue-on-error: true

      - name: Provision Infrastructure
        run: azd provision --no-prompt

      - name: Deploy Application
        run: azd deploy --no-prompt
