# GitHub Actions workflow to deploy to Azure using azd
# To configure required secrets for connecting to Azure, simply run `azd pipeline config`

on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZD_ALPHA_ENABLE_RESOURCEGROUPDEPLOYMENTS: "true"

defaults:
  run:
    working-directory: ./AspireDemo2/AspireDemo2.AppHost

jobs:
  build-and-test:
    uses: ./.github/workflows/aspiredemo2-build-test.yaml
    secrets: inherit
    with:
      project-name: AspireDemo2
      solution-path: AspireDemo2/AspireDemo2.sln

  deploy-to-dev:
    uses: ./.github/workflows/aspiredemo2-deploy.yaml
    needs: build-and-test
    secrets: inherit
    with:
      environment-name: "Dev"
      working-directory: "./AspireDemo2/AspireDemo2.AppHost"
      dotnet-version: "8.0.x"

  deploy-to-test:
    uses: ./.github/workflows/aspiredemo2-deploy.yaml
    needs: deploy-to-dev
    secrets: inherit
    with:
      environment-name: "Test"
      working-directory: "./AspireDemo2/AspireDemo2.AppHost"
      dotnet-version: "8.0.x"
