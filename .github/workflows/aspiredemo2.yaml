# GitHub Actions workflow to deploy to Azure using azd
# To configure required secrets for connecting to Azure, simply run `azd pipeline config`

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZD_ALPHA_ENABLE_RESOURCEGROUPDEPLOYMENTS: "true"

defaults:
  run:
    working-directory: ./AspireDemo2/AspireDemo2.AppHost

jobs:
  build-and-test:
    uses: ./.github/workflows/aspiredemo2-build-test.yaml
    secrets: inherit
    with:
      project-name: AspireDemo2
      solution-path: AspireDemo2/AspireDemo2.sln

  deploy:
    strategy:
      matrix:
        environment: [Dev, Test]
        region: [eastus, centralus] # Multi-region deployment support
      fail-fast: false # Continue with other regions/environments if one fails
    uses: ./.github/workflows/aspiredemo2-deploy.yaml
    needs: build-and-test
    secrets: inherit
    with:
      environment-name: ${{ matrix.environment }}
      working-directory: "./AspireDemo2/AspireDemo2.AppHost"
      dotnet-version: "8.0.x"
      azure-location: ${{ matrix.region }}
      resource-group: rg-aspire-${{ matrix.environment }}-${{ matrix.region }}
